version: "3.2"


services:

  mysql-db:
    image: mysql:8.4
    container_name: mysql-container
    ports:
      - "3306:3306"
    environment:
       MYSQL_USER: user
       MYSQL_ROOT_PASSWORD: password
       MYSQL_PASSWORD: MysqlServer@3306
       MYSQL_DATABASE: opmms
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
 mysql_data: